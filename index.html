<title>Grammar Coach</title>
<style>
:root{--paper:#fdfdfb;--line:#dfe6f3;--ink:#1b2a6b;--mut:#6a7391;--card:#ffffff;--bd:#cfd8ee;--ok:#1a7f4b;--ko:#c8302b;--hl:#fff3b0}
@media(prefers-color-scheme:dark){:root{--paper:#14161f;--line:#1f2433;--ink:#c9d4ff;--mut:#8b94b5;--card:#1a1d29;--bd:#2c3248;--ok:#4cc38a;--ko:#ff7a6b;--hl:#4a4320}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 -apple-system,"Helvetica Neue",sans-serif;
background-image:repeating-linear-gradient(var(--line) 0 1px,transparent 1px 32px);min-height:100vh}
main{max-width:760px;margin:0 auto;padding:28px 20px 80px}
h1{font:600 30px/1.1 "Iowan Old Style",Palatino,Georgia,serif;margin:0}
h2{font:600 22px/1.2 "Iowan Old Style",Palatino,Georgia,serif;margin:0 0 6px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:7px 14px;border:1px solid var(--ink);background:var(--card);color:var(--ink);border-radius:6px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
button.p{background:var(--ink);color:var(--paper)}button.p:hover{opacity:.85}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ko);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;margin-bottom:10px}
.n{cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px}
.n:hover{border-color:var(--ink)}
.lv{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border:1px solid var(--ink);border-radius:10px;margin-right:8px}
.mut{color:var(--mut);font-size:14px}
.pb{height:6px;background:var(--line);border-radius:3px;width:110px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ok)}
.course p{margin:.5em 0;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px}
.course ul{margin:.4em 0;padding-left:22px;font-family:"Iowan Old Style",Palatino,Georgia,serif;font-size:17px}
code{background:var(--hl);padding:0 4px;border-radius:3px}
.q{font:600 20px/1.4 "Iowan Old Style",Palatino,Georgia,serif;margin:10px 0 14px}
input[type=text],textarea{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink)}
textarea{min-height:160px;font:13px/1.4 ui-monospace,Menlo,monospace}
.ch{display:block;width:100%;text-align:left;margin-bottom:8px;padding:10px 14px}
.ch.ok{border-color:var(--ok);background:var(--ok);color:#fff}.ch.ko{border-color:var(--ko);background:var(--ko);color:#fff}
.fb{margin-top:14px;padding:10px 14px;border-left:4px solid var(--ok);background:var(--card)}
.fb.ko{border-color:var(--ko)}.fb b.ko{color:var(--ko)}.fb b.ok{color:var(--ok)}
.empty{text-align:center;padding:40px 10px}
.filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.filters button.on{background:var(--ink);color:var(--paper)}
pre{background:var(--card);border:1px solid var(--bd);padding:10px;border-radius:6px;overflow:auto;font-size:12px}
.msg{padding:8px 12px;border-radius:6px;margin:10px 0;background:var(--hl)}
.tm{font:600 40px ui-monospace,Menlo,monospace;margin:6px 0 16px}
.nav{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--ink);margin-bottom:20px}
.nav button{border:0;border-radius:6px 6px 0 0;background:none;font-weight:600;padding:9px 16px}.nav button.on{background:var(--ink);color:var(--paper)}
select{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}
.st{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.st div{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:10px;text-align:center}
.st b{display:block;font:600 24px "Iowan Old Style",Palatino,Georgia,serif}
.li{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1px solid var(--bd)}.li>div:first-child{flex:1;min-width:0}.li button{padding:3px 10px}
.tbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.tbar i{display:block;height:100%;background:var(--ko);animation:lxt 6s linear forwards}
@keyframes lxt{from{width:100%}to{width:0}}
</style>
</head>

<script>
const LV=['A1','A2','B1','B2','C1','C2'];
const SAMPLE={notions:[
{id:"be-present",title:"To be au présent",level:"A2",chapter:1,
course:"**Conjugaison** : I **am**, you **are**, he/she/it **is**, we **are**, they **are**.\n- Forme contractée : `I'm`, `she's`, `they're`.\n- Négation : `He isn't` / `He is not`.\n- Question : on inverse → `Is she tired?`",
exercises:[
{type:"gap",q:"She ___ a pilot.",a:["is","'s"],explain:"3e personne du singulier → is."},
{type:"gap",q:"They ___ not at home. (forme contractée acceptée)",a:["are","aren't","'re"],explain:"they → are."},
{type:"mcq",q:"___ you ready?",choices:["Is","Are","Am"],a:1,explain:"you → are, inversion pour la question."}]},
{id:"pp-vs-preterite",title:"Present perfect vs preterite",level:"B2",chapter:12,
course:"- **Preterite** : action terminée à un moment passé précis (`I flew to Lyon yesterday`).\n- **Present perfect** : lien avec le présent, durée jusqu'à maintenant, ou moment non précisé (`I've flown 500 hours`).\n- `since` + point de départ, `for` + durée.\nPas de present perfect avec un repère passé précis : *yesterday, last week, in 2019*.",
exercises:[
{type:"gap",q:"I ___ (live) in Caen since 2020.",a:["have lived","'ve lived"],explain:"since → present perfect."},
{type:"mcq",q:"We ___ the briefing an hour ago.",choices:["have finished","finished","had finished"],a:1,explain:"« an hour ago » = repère précis → preterite."},
{type:"gap",q:"She has worked here ___ three years. (for / since)",a:["for"],explain:"for + durée."}]}
]};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();
const fmt=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/`(.+?)`/g,'<code>$1</code>')
 .split('\n').map(l=>/^\s*- /.test(l)?'<li>'+l.replace(/^\s*- /,'')+'</li>':l.trim()?'<p>'+l+'</p>':'').join('')
 .replace(/(<li>.*?<\/li>)+/g,m=>'<ul>'+m+'</ul>');
let S={notions:[],prog:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('gc_v1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('gc_v1',JSON.stringify(S))}catch(e){}};
const key=(n,e)=>n.id+'|'+e.q;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let V={name:'home',filter:'all',folder:'Cours et exercices'},Q=null,msg='';

function mastery(n){const t=n.exercises.length;if(!t)return 0;return Math.round(100*n.exercises.filter(e=>(S.prog[key(n,e)]||{}).last===true).length/t)}
function wrongList(){const o=[];S.notions.forEach(n=>n.exercises.forEach(e=>{if((S.prog[key(n,e)]||{}).last===false)o.push({n,e})}));return o}

function importData(txt){
 let d;try{d=JSON.parse(txt)}catch(e){return "JSON invalide : "+e.message}
 const arr=Array.isArray(d)?d:(d.notions||(d.id?[d]:null));
 if(!arr)return "Aucune notion trouvée (attendu : un tableau, ou un objet avec « notions »).";
 let add=0,upd=0;
 for(const n of arr){
  if(!n.id||!n.title||!Array.isArray(n.exercises))return "Notion invalide : il faut id, title et exercises.";
  n.level=n.level||'B1';
  const i=S.notions.findIndex(x=>x.id===n.id);
  if(i>=0){S.notions[i]=n;upd++}else{S.notions.push(n);add++}
 }
 if(d.prog&&typeof d.prog==='object')Object.assign(S.prog,d.prog);
 S.notions.sort((a,b)=>LV.indexOf(a.level)-LV.indexOf(b.level)||(a.chapter||999)-(b.chapter||999));
 save();return `${add} notion(s) ajoutée(s), ${upd} mise(s) à jour.`;
}

function render(){
 const A=$('#app');
 if(V.name==='home')A.innerHTML=home();
 else if(V.name==='import')A.innerHTML=imp();
 else if(V.name==='notion')A.innerHTML=notion();
 else if(V.name==='quiz')A.innerHTML=quiz();
 else if(V.name==='lex')A.innerHTML=LX.view();
 else if(V.name==='tutor')A.innerHTML=TU.view();
 const f=A.querySelector('input[type=text]');if(f&&V.name!=='lex')f.focus();
 if(V.name==='lex')LX.after();
 clearInterval(window.TI);
 if(V.name==='quiz'&&Q&&Q.i<Q.items.length&&Q.items[Q.i].e.type==='oral'&&!Q.rev)
  window.TI=setInterval(()=>{const t=$('#tm');if(t)t.textContent=((performance.now()-Q.t0)/1000).toFixed(1)+' s'},100);
}
const go=(name,extra={})=>{V=Object.assign({name,filter:V.filter,folder:V.folder},extra);msg='';render();window.scrollTo(0,0)};

const FOLD0='Cours et exercices',FOLDERS=[FOLD0,'Oral : modaux','Oral : poser des questions'];
const folderOf=n=>n.folder||(n.id.indexOf('oral-')===0?FOLDERS[1]:FOLD0);
const GN=()=>S.notions.filter(n=>!n.tutor);
const nOral=l=>l.reduce((t,n)=>t+n.exercises.filter(e=>e.type==='oral').length,0);
function home(){
 const fl=FOLDERS.concat(GN().map(folderOf)).filter((f,i,a)=>a.indexOf(f)===i&&(f===FOLD0||GN().some(n=>folderOf(n)===f)));
 window.FL=fl;
 if(fl.indexOf(V.folder)<0)V.folder=fl[0];
 const inF=GN().filter(n=>folderOf(n)===V.folder);
 const lvls=inF.map(n=>n.level).filter((l,i,a)=>a.indexOf(l)===i).sort((a,b)=>LV.indexOf(a)-LV.indexOf(b));
 if(V.filter!=='all'&&lvls.indexOf(V.filter)<0)V.filter='all';
 const list=inF.filter(n=>V.filter==='all'||n.level===V.filter);
 const w=wrongList().length,o=nOral(inF);
 return navBar('gram')+`<header><h1>Grammar Coach</h1><div class="bar">
  <button class="p" onclick="go('import')">Importer des notions</button>
  ${w?`<button onclick="startQuiz('review')">Réviser mes erreurs (${w})</button>`:''}
  ${S.notions.length?`<button onclick="exportAll()">Exporter</button>`:''}</div></header>
 ${msg?`<div class="msg">${esc(msg)}</div>`:''}
 ${S.notions.length?`<div class="filters">${fl.map((f,i)=>`<button class="${f===V.folder?'on':''}" onclick="V.folder=FL[${i}];V.filter='all';render()">${esc(f)}</button>`).join('')}</div>`:''}
 ${o?`<div class="card"><b>Entraînement éclair</b><div class="mut">${o} phrases à dire à voix haute, en moins de 2,5 s chacune.</div><p><button class="p" onclick="startQuiz('oral')">Lancer (${o})</button></p></div>`:''}
 ${lvls.length>1?`<div class="filters"><button class="${V.filter==='all'?'on':''}" onclick="V.filter='all';render()">Tout</button>${lvls.map(l=>`<button class="${V.filter===l?'on':''}" onclick="V.filter='${l}';render()">${l}</button>`).join('')}</div>`:''}
 ${list.map(n=>`<div class="card n" onclick="go('notion',{id:'${n.id}'})" tabindex="0" onkeydown="if(event.key==='Enter')this.click()">
  <div><span class="lv">${esc(n.level)}</span><b>${esc(n.title)}</b><div class="mut">${n.exercises.length} exercices</div></div>
  <div class="pb" title="${mastery(n)} % maîtrisé"><i style="width:${mastery(n)}%"></i></div></div>`).join('')}
 ${S.notions.length?'':`<div class="card empty"><h2>Aucune notion pour l'instant</h2><p class="mut">Envoie-moi une notion dans le chat, je te renvoie un bloc ou un fichier à importer ici.</p>
 <button class="p" onclick="go('import')">Importer</button></div>`}`;
}

function imp(){
 return `<header><h1>Importer</h1><button onclick="go('home')">Retour</button></header>
 <div class="card"><p>Colle le JSON fourni dans le chat, ou charge un fichier <code>.json</code>. Une notion qui existe déjà (même <code>id</code>) est mise à jour, ta progression est conservée.</p>
 <textarea id="txt" placeholder='{"notions":[...]}' spellcheck="false"></textarea>
 <p><button class="p" onclick="doImport()">Importer</button>
 <input type="file" accept=".json,application/json" onchange="loadFile(this.files[0])"></p></div>
 <div class="card"><b>Format d'une notion</b><pre>{ "id": "present-perfect", "title": "Present perfect", "level": "B2", "chapter": 12, "folder": "Oral : poser des questions",
  "course": "texte avec **gras**, \`code\`, et lignes - à puces",
  "exercises": [
   { "type": "gap", "q": "I ___ (live) here since 2010.", "a": ["have lived","'ve lived"], "explain": "..." },
   { "type": "mcq", "q": "...", "choices": ["x","y","z"], "a": 1, "explain": "..." }
  ] }</pre></div>`;
}
function doImport(){const r=importData($('#txt').value);msg=r;go('home');msg=r;render()}
function loadFile(f){if(!f)return;const r=new FileReader();r.onload=()=>{$('#txt').value=r.result};r.readAsText(f)}
function exportAll(){
 const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='grammar-coach-sauvegarde.json';a.click();
}

function notion(){
 const n=S.notions.find(x=>x.id===V.id);
 return `<header><div><span class="lv">${esc(n.level)}</span><h1 style="display:inline">${esc(n.title)}</h1></div><button onclick="go('${n.tutor?'tutor':'home'}')">Retour</button></header>
 <div class="card course">${fmt(n.course||'')}</div>
 <div class="bar"><button class="p" onclick="startQuiz('notion','${n.id}')">S'entraîner (${n.exercises.length})</button>
 <button onclick="if(confirm('Supprimer cette notion ?')){S.notions=S.notions.filter(x=>x.id!=='${n.id}');save();go('${n.tutor?'tutor':'home'}')}">Supprimer</button></div>`;
}

function startQuiz(mode,id){
 let items;
 if(mode==='review')items=wrongList();
 else if(mode==='oral'){items=[];S.notions.forEach(n=>{if(folderOf(n)===V.folder)n.exercises.forEach(e=>{if(e.type==='oral')items.push({n,e})})})}
 else{const n=S.notions.find(x=>x.id===id);items=n.exercises.map(e=>({n,e}))}
 Q={items:shuffle(items),i:0,ok:0,answered:null,back:mode==='notion'?'notion':'home',id,mode,rev:false,t0:performance.now(),times:[]};
 go('quiz');
}
function answer(val){
 const {n,e}=Q.items[Q.i];

 const k=key(n,e),p=S.prog[k]||{ok:0,ko:0};
 ok?p.ok++:p.ko++;p.last=ok;S.prog[k]=p;save();
 if(ok)Q.ok++;
 try{TU.log(n,e,ok,(performance.now()-Q.t0)/1000)}catch(x){}Q.answered={ok,val};render();
}

  if(!Q.rev&&(ev.key===' '||ev.key==='Enter')){ev.preventDefault();reveal()}
  else if(Q.rev&&(ev.key==='1'||ev.key==='ArrowRight')){ev.preventDefault();gradeOral(true)}

function status(n){const s=stat(n.id),t=n.exercises.length;
 if(!s.n)return pre(n)?1:0;
 if(s.n<10||s.dist<Math.min(10,t*.4)||s.rate<.8)return 2;
 if(s.rate>=.9&&s.fast>=.7&&s.dist>=Math.min(15,t*.5)&&s.days>=2)return s.last-s.first>=7*DAY?5:4;
 return 3}
function build(N){const L=NS();if(!L.length)return null;
 const wip=L.filter(n=>status(n)===2).length,
 sc=L.map(n=>{const k=status(n),s=stat(n.id),d=Math.min(21,(Date.now()-s.last)/DAY),c=n.chapter||0;
  let v=[-1,50-c*.1,60+(1-s.rate)*40+(1-s.fast)*10,40+(1-s.fast)*20+d*2,10+d*3,5+d*2][k];if(k===1&&wip>=3)v=20-c*.1;return{n,k,s,v}}).filter(x=>x.k>0).sort((a,b)=>b.v-a.v);
 if(!sc.length)return null;
 const t=sc[0],tn=t.n,seen=e=>S.prog[key(tn,e)],pick=(a,m)=>shuffle(a).slice(0,m),items=[],add=(n,l,ph)=>l.forEach(e=>items.push({n,e,ph})),oral=n=>n.exercises.filter(e=>e.type==='oral'),bad=[];
 L.forEach(n=>n.exercises.forEach(e=>{if(n!==tn&&(S.prog[key(n,e)]||{}).last===false)bad.push({n,e})}));
 pick(bad,Math.round(N*.2)).forEach(x=>items.push({n:x.n,e:x.e,ph:PH[0]}));
 sc.filter(x=>x.k>=4&&Date.now()-x.s.last>7*DAY).slice(0,2).forEach(x=>add(x.n,pick(oral(x.n),2),PH[0]));
 if(t.k<=2)add(tn,pick(tn.exercises.filter(e=>e.type!=='oral'),Math.round(N*.2)),PH[1]);
 const o=oral(tn),un=o.filter(e=>!seen(e)),m=Math.max(4,N-items.length-Math.round(N*.2));
 add(tn,un.length?un.slice(0,m):pick([...o.filter(e=>seen(e)&&seen(e).last===false),...shuffle(o)].filter((e,i,a)=>a.indexOf(e)===i),m),PH[2]);
 sc.slice(1).filter(x=>x.s.n>0).slice(0,2).forEach(x=>add(x.n,pick(oral(x.n),Math.ceil(N*.1)),PH[3]));
 const why=['','Nouvelle notion : ses prérequis sont acquis, on la découvre.',`Notion en apprentissage : ${pc(t.s.rate)} de réussite récente, ${pc(t.s.fast)} de réponses en moins de 2,5 s.`,`Presque acquise : il reste à gagner en vitesse (${pc(t.s.fast)} en moins de 2,5 s).`,'Entretien : on vérifie que la notion tient dans le temps.','Entretien : on vérifie que la notion tient dans le temps.'][t.k];
 return{tg:tn,k:t.k,items,why}}
const gp=()=>plan=plan||build(size);
function start(){const p=gp();if(!p)return;const sid=Date.now();plan=null;Q={items:p.items,i:0,ok:0,answered:null,back:'tutor',id:'',mode:'tutor',rev:false,t0:performance.now(),times:[],sid};go('quiz')}
function today(){const p=gp(),c=f=>p.items.filter(i=>i.ph===f).length,d=new Date().toDateString(),n=T.log.filter(x=>new Date(x.t).toDateString()===d).length;
 return `<div class="card"><span class="mut">Objectif du jour</span><h2>${esc(p.tg.title)}</h2><div class="mut">${LB[p.k]} · ${esc(p.why)}</div>
 <p>${PH.map(f=>c(f)?`<span class="lv">${f} ${c(f)}</span>`:'').join('')}</p>
 <div class="row"><span class="mut">Durée</span><select onchange="TU.set('size',+this.value)">${[[12,'Courte (≈ 5 min)'],[25,'Normale (≈ 10 min)'],[40,'Longue (≈ 16 min)']].map(([v,l])=>`<option value="${v}"${v===size?' selected':''}>${l}</option>`).join('')}</select></div>
 <p><button class="p" onclick="TU.start()">Commencer la séance (${p.items.length})</button></p></div>
 ${p.k<=2?`<div class="card course"><b>Rappel de cours</b>${fmt(p.tg.course||'')}</div>`:''}<p class="mut">Aujourd'hui : ${n} exercice(s) faits.</p>`}
function path(L){const nx=L.find(n=>status(n)>0&&status(n)<=2),by={};L.forEach(n=>(by[n.et]=by[n.et]||[]).push(n));
 return Object.keys(by).map(e=>{const a=by[e];return `<h2 style="margin-top:18px">Étape ${e} · ${esc(a[0].etn)}</h2><div class="mut" style="margin-bottom:8px">${a.filter(n=>status(n)>=4).length}/${a.length} maîtrisées</div>`+a.map(n=>{const s=stat(n.id),k=status(n);
 return `<div class="card n" onclick="go('notion',{id:'${n.id}'})"><div><span class="lv">${n.chapter}</span><span class="lv">${esc(n.level)}</span><b>${esc(n.title)}</b>${n===nx?' <span class="lv">à faire</span>':''}<div class="mut">${LB[k]}${s.n?` · ${pc(s.rate)} de réussite · ${pc(s.fast)} en 2,5 s`:''}</div></div><div class="pb" title="réponses orales en 2,5 s"><i style="width:${Math.round(s.fast*100)}%"></i></div></div>`}).join('')}).join('')}
function ecl(L){const ets=[...new Set(L.map(n=>n.et))],sc=L.filter(n=>!ef||n.et===ef),k=sc.reduce((t,n)=>t+n.exercises.filter(e=>e.type==='oral').length,0);
 return `<div class="card"><b>Entraînement éclair</b><div class="mut">Des phrases à dire à voix haute en anglais, en moins de 2,5 s chacune.</div>
 <div class="row"><span class="mut">Étape</span><select onchange="TU.set('ef',+this.value)"><option value="0">Toutes les étapes</option>${ets.map(e=>`<option value="${e}"${e===ef?' selected':''}>Étape ${e} · ${esc(L.find(n=>n.et===e).etn)}</option>`).join('')}</select>
 <span class="mut">Nombre</span><select onchange="TU.set('ec',+this.value)">${[20,40,80].map(v=>`<option value="${v}"${v===ec?' selected':''}>${v}</option>`).join('')}</select></div>
 <p><button class="p" onclick="TU.startE()">Lancer (${Math.min(ec,k)} sur ${k})</button></p></div>`}
function startE(){const items=[];NS().filter(n=>!ef||n.et===ef).forEach(n=>n.exercises.forEach(e=>{if(e.type==='oral')items.push({n,e})}));if(!items.length)return;
 Q={items:shuffle(items).slice(0,ec),i:0,ok:0,answered:null,back:'tutor',id:'',mode:'oral',rev:false,t0:performance.now(),times:[],sid:Date.now()};go('quiz')}
function rep(L){const lim=per?Date.now()-per*DAY:0,a=T.log.filter(x=>x.t>=lim),o=a.filter(x=>x.s!=null),r=(x,y)=>y?pc(x/y):'–';
 const ds=new Set(T.log.map(x=>+new Date(new Date(x.t).toDateString())));let c=+new Date(new Date().toDateString()),st=0;if(!ds.has(c))c-=DAY;while(ds.has(c)){st++;c-=DAY}
 const m={};T.log.forEach(x=>{const k=x.n+'|'+x.h,z=m[k]=m[k]||{n:x.n,h:x.h,ko:0};if(!x.ok)z.ko++;z.l=x.ok});
 const rec=Object.values(m).filter(x=>x.ko>=2).sort((p,q)=>q.ko-p.ko).slice(0,8).map(x=>{const n=L.find(y=>y.id===x.n),e=n&&n.exercises.find(e=>H(e.q)===x.h);return e&&{e,x}}).filter(Boolean);
 const wk=[5,4,3,2,1,0].map(i=>{const z=T.log.filter(x=>x.t>=Date.now()-(i+1)*7*DAY&&x.t<Date.now()-i*7*DAY);return{l:i?`il y a ${i} sem.`:'cette semaine',n:z.length,r:z.length?z.filter(x=>x.ok).length/z.length:null}});
 const st5=L.map(status);
 return `<div class="row"><span class="mut">Période</span><select onchange="TU.set('per',+this.value)">${[[7,'7 jours'],[30,'30 jours'],[90,'3 mois'],[0,'Depuis le début']].map(([v,l])=>`<option value="${v}"${v===per?' selected':''}>${l}</option>`).join('')}</select></div>
 <div class="st"><div><b>${a.length}</b><span class="mut">exercices</span></div><div><b>${r(a.filter(x=>x.ok).length,a.length)}</b><span class="mut">réussite</span></div><div><b>${o.length?(o.reduce((t,x)=>t+x.s,0)/o.length).toFixed(1)+' s':'–'}</b><span class="mut">temps moyen oral</span></div><div><b>${st}</b><span class="mut">jours de suite</span></div></div>
 <div class="card"><b>Automatisation orale</b><div class="mut">${o.length} réponses orales : ${r(o.filter(x=>x.ok&&x.s<=FAST).length,o.length)} justes en ${FAST} s ou moins, ${r(o.filter(x=>x.ok&&x.s>FAST).length,o.length)} justes mais lentes, ${r(o.filter(x=>!x.ok).length,o.length)} ratées.</div></div>
 <div class="card"><b>Maîtrise des notions</b><div class="mut">${LB.map((l,i)=>st5.filter(k=>k===i).length?st5.filter(k=>k===i).length+' '+l.toLowerCase():'').filter(Boolean).join(' · ')}</div></div>
 <div class="card"><b>Réussite par semaine</b>${wk.map(w=>`<div class="li"><div>${w.l}</div><div class="pb" style="width:160px"><i style="width:${Math.round((w.r||0)*100)}%"></i></div><span class="mut">${w.r==null?'–':pc(w.r)} (${w.n})</span></div>`).join('')}</div>
 <div class="card"><b>Erreurs récurrentes</b>${rec.length?rec.map(z=>`<div class="li"><div>${esc(z.e.q)}<div class="mut">${esc([].concat(z.e.type==='mcq'?z.e.choices[z.e.a]:z.e.a)[0])}</div></div><span class="mut">${z.x.ko>=4&&!z.x.l?'persistante':'répétée'} · ${z.x.ko}×</span></div>`).join(''):'<div class="mut">Aucune pour le moment.</div>'}</div>
 <div class="card"><b>Sauvegarde de l'historique Tutor</b><p><button onclick="TU.exp()">Exporter</button> <input type="file" accept=".json,application/json" onchange="TU.imp(this.files[0])"></p></div>`}
function view(){const L=NS(),m=msg;msg='';
 const h=navBar('tutor')+`<header><h1>Tutor</h1></header>${m?`<div class="msg">${esc(m)}</div>`:''}<div class="filters">${[['today',"Aujourd'hui"],['path','Parcours'],['ecl','Éclair oral'],['rep','Bilan']].map(([k,n])=>`<button class="${k===tab?'on':''}" onclick="TU.tab('${k}')">${n}</button>`).join('')}</div>`;
 if(!L.length)return h+`<div class="card empty"><h2>Aucun parcours</h2><p class="mut">Importe le pack Tutor (grammar_coach_pack_tutor.json) dans Grammaire › Importer des notions.</p></div>`;
 if(tab==='today'&&!gp())return h+`<div class="card empty">Rien à proposer pour l'instant.</div>`;
 return h+(tab==='today'?today():tab==='path'?path(L):tab==='ecl'?ecl(L):rep(L))}
return{view,log,start,startE,tab(t){tab=t;plan=null;render()},set(p,v){if(p==='size'){size=v;plan=null}else if(p==='per')per=v;else if(p==='ef')ef=v;else ec=v;render()},
 exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(T)],{type:'application/json'}));a.download='grammar-coach-tutor-historique.json';a.click()},
 imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result),k=new Set(T.log.map(x=>x.t+x.h));(d.log||[]).forEach(x=>{if(!k.has(x.t+x.h))T.log.push(x)});T.log.sort((a,b)=>a.t-b.t);sv();plan=null;msg='Historique importé.'}catch(e){msg='Fichier invalide.'}render()};r.readAsText(f)}}
})();
render();
</script>
